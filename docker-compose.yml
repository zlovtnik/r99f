version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: r99f-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: r99f-backend
    environment:
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/app_db
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      RUST_LOG: debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r99f-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
